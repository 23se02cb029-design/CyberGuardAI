services:
  - type: web
    name: cyberguard-ai
    env: node
    plan: free
    region: ohio
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: cyberguard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: cyberguard-db
    plan: free
    region: ohio
    databaseName: cyberguard
    user: cyberguard
